[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-booking-enrichment"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pyspark>=3.5,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools]
py-modules = ["booking_enrichment"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
