bundle:
  name: git-booking-enrichment
  databricks_cli_version: ">= 0.218.0"

include:
  - resources/*.yml

variables:
  source_catalog:
    default: claudecatalog
  source_schema:
    default: raw
  target_catalog:
    default: claudecatalog
  target_schema:
    default: silver
  target_table:
    default: git_booking_enriched
  schedule_pause_status:
    default: PAUSED

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-4d3c1c22-646c.cloud.databricks.com
    variables:
      target_table: git_booking_enriched_dev
      schedule_pause_status: PAUSED

  prod:
    mode: production
    workspace:
      host: https://dbc-4d3c1c22-646c.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      target_table: git_booking_enriched
      schedule_pause_status: UNPAUSED
