resources:
  jobs:
    booking_enrichment:
      name: "[${bundle.target}] booking enrichment hourly"
      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: UTC
        pause_status: ${var.schedule_pause_status}

      tasks:
        - task_key: enrich_bookings
          spark_python_task:
            python_file: ../src/booking_enrichment.py
            parameters:
              - --source-catalog
              - ${var.source_catalog}
              - --source-schema
              - ${var.source_schema}
              - --target-catalog
              - ${var.target_catalog}
              - --target-schema
              - ${var.target_schema}
              - --target-table
              - ${var.target_table}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "6"
